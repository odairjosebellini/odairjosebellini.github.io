---
layout: default
---
<div class="container">
  <article class="post">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>{{ page.date | date: "%B %d, %Y" }}</span>
    </div>
    <div class="post-content">
      {{ content }}
    </div>
    <div class="post-navigation">
      <a href="{{ '/' | relative_url }}" class="back-link">← Voltar para a página inicial</a>
    </div>
  </article>
</div>
